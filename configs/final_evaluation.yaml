    file: hybrid_fallback.json
    sha256: 5717cbb3b311b0d02fc997d2910cf27527fe14042a3fde8903a73cc2942c7d9a
    weight: 0.6
  # sha256 of json.dumps(allowlist) in configs/lightgbm.yaml order (32 columns)
  feature_allowlist_sha256: 995b69397a638f9e99fba53dcb5eea3f795e02693fcf5b001cb9e28f6ce42eef
  lightgbm_version: 4.7.0
  contract_tags:
