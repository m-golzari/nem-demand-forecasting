# Final holdout evaluation protocol (frozen 2026-10-17 BEFORE the evaluator was written and
# BEFORE any holdout outcome was read). Decision D-47. Inherits configs/backtest.yaml (slice
# definitions, residual quantile interpolation, bootstrap) and configs/lightgbm.yaml
# (allowlist). Changing any value requires a decision-log entry. The evaluation is
# descriptive and final: no result triggers retraining, recalibration, a new calibration
# method or a second holdout candidate.
protocol_version: 1
protocol_id: final-holdout-evaluation-v1
decision_rule: descriptive_final

selected_candidate: lightgbm_trailing_calibrated
benchmark: day_week_hybrid_frozen          # also the fallback; no model switching is evaluated
headline_models: [lightgbm_trailing_calibrated, day_week_hybrid_frozen]
quantile_order: frozen_uncorrected         # crossings are reported, never sorted or repaired

# The model artefact is used as built. Everything below is verified before any prediction.
artefact:
  run_id: final_artefact_20261017
  model_producing_commit: bfed6d78817c47ccd7c97808ae4d373dd759544b   # not the evaluator commit
  pre_evaluation_manifest_sha256: 58ef2cfb70487ea3720c465a0d69fbc46b44f0544ae7a7c45f87608994267a35
  candidate_record:
