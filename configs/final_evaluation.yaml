holdout:
  first_origin: "2026-07-01"
  last_origin: "2026-09-30"
  expected_origins: 92
  expected_rows: 2208
  horizons_per_origin: 24

# Stage 1 (prediction) may project only keys + allowlist + lag_168h__available (hybrid input).
# Stage 2 (evaluation) opens target and slice columns only after the predictions are sealed.
stages:
  prediction_columns_extra: [lag_168h__available]
  forbidden_in_prediction: [target_dispatch_totaldemand_hourly_mean_mw, target_available]

metrics:
  primary: mae_mw                           # calibrated p50 is the point forecast
  secondary: wape_aggregate                 # sum(|f - y|) / sum(y)
  uncertainty_ranking: mean_pinball         # mean of p10/p50/p90 pinball losses
  reported: [mae_mw, rmse_mw, wape, mean_signed_error_mw, pinball_p10, pinball_p50, pinball_p90,
             mean_pinball, coverage_p10_p90, mean_interval_width_mw, crossing_rate,
             crossing_mean_magnitude_mw, lower_tail_miss_rate, upper_tail_miss_rate]
  headline_rows: identical                  # both models available and target available

slices:
  # origin_month = market month of the origin; season = civil month of the target hour;
  # evening and day type follow configs/backtest.yaml.
  dimensions: [origin_month, horizon, market_hour, is_civil_evening, day_type, season,
               is_high_demand]
  expected_seasons: [winter, spring]
  high_demand:
    rule: training_quantile                 # 0.9 quantile (backtest.yaml) of available targets
    training_last_origin: "2026-06-29"      # = final-training cutoff; pre-holdout rows only
    training_rows: 39384
    threshold_mw: 6243.067666666667         # computed 2026-10-17 from pre-holdout targets only

bootstrap:                                  # must equal configs/backtest.yaml
  block: market_date
  replicates: 2000
  seed: 20261016
  confidence: 0.95
  comparisons:                              # candidate minus benchmark, identical rows
    - mae_mw
    - mean_pinball

# End-to-end rehearsal on development origins with copied artefact and pre-holdout inputs.
# Rehearsal results are labelled rehearsal-only and never update a benchmark or selection.
rehearsal:
  first_origin: "2026-03-01"
  last_origin: "2026-05-31"
  expected_origins: 92
  expected_rows: 2208
