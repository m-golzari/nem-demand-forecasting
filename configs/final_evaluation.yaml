    sha256: 77d78bd07117ae8b5a9ae8d786ae686b85fa17c69fdaeb788731f6eecdcbd268
  models:
    p10: {file: models/lightgbm_p10.txt, alpha: 0.1, iterations: 344,
          sha256: 1d168e4efdea3f8ef38538711721bd0273f95e89d70d1195b21373e4f173d335}
    p50: {file: models/lightgbm_p50.txt, alpha: 0.5, iterations: 387,
