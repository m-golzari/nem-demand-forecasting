[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "nem-forecast"
version = "0.0.1"
description = "Leakage-safe day-ahead probabilistic VIC1 demand forecasting portfolio data product."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
# Dependencies are added in the phase that first needs them.
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
    "typer>=0.12,<1",
    # Phase 1: source download, parsing, canonical Parquet
    "httpx>=0.27,<1",
    "pandas>=2.2,<3",
    "pyarrow>=16,<22",
    # Phase 2: independent reconciliation and reproducible SQL views
    "duckdb>=1.0,<2",
    # Phase 3: Victorian public holidays (pinned: holiday data changes features)
    "holidays>=0.106,<0.107",
    # Phase 4: static diagnostic plots
    "matplotlib>=3.8,<4",
    # Phase 6: direct quantile gradient boosting
    "lightgbm>=4.3,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "types-PyYAML>=6.0,<7",
    "pandas-stubs>=2.2,<3",
]

[project.scripts]
nem-forecast = "nem_forecast.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nem_forecast = ["py.typed", "target/sql/*.sql", "features/sql/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "PTH", "RUF", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# Fixtures deliberately build naive AEMO source timestamps.
"tests/**" = ["DTZ"]
# Verbatim NEMWeb listing HTML.
"tests/aemo_fixtures.py" = ["DTZ", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network and not integration'"
markers = [
    "network: test requires internet access (deselected by default; run with -m network)",
    "integration: test reads the local historical snapshot in data/raw (run with -m integration)",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "lightgbm", "lightgbm.*"]
ignore_missing_imports = true
